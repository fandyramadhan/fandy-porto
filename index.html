    <!-- Analytics: Microsoft Clarity + Meta Pixel.
         Both snippets queue their calls (clarity.q / fbq.queue) and replay
         them once their library arrives, so the tracking calls fire right
         away while the ~200 KB of library code is fetched after load instead
         of competing with first paint. No events are lost, they are just
         sent a moment later. -->
    <script>
      // Clarity stub
      (function (c, a, i) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        c[a].i = i;
      })(window, "clarity", "wmldw28i1c");

      // Meta Pixel stub
      !(function (f, n) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod
            ? n.callMethod.apply(n, arguments)
            : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
      })(window);
      fbq("init", "715359714827398");
      fbq("track", "PageView");

      // Fetch both libraries once the page has finished loading, or as soon
      // as the visitor touches the page — whichever comes first.
      //
      // The interaction triggers matter: tapping a WhatsApp button hands the
      // phone over to the WhatsApp app, which can freeze this page before a
      // queued event has been flushed. Loading on the first sign of activity
      // means the pixel is almost always ready before any button is pressed.
      (function () {
        var done = false;
        function loadAnalytics() {
          if (done) return;
          done = true;
          ["pointerdown", "touchstart", "keydown", "scroll"].forEach(
            function (type) {
              window.removeEventListener(type, loadAnalytics);
            },
          );
          [
            "https://www.clarity.ms/tag/" + window.clarity.i,
            "https://connect.facebook.net/en_US/fbevents.js",
          ].forEach(function (src) {
            var el = document.createElement("script");
            el.async = true;
            el.src = src;
            document.head.appendChild(el);
          });
        }

        ["pointerdown", "touchstart", "keydown", "scroll"].forEach(
          function (type) {
            window.addEventListener(type, loadAnalytics, {
              once: true,
              passive: true,
            });
          },
        );

        if (document.readyState === "complete") loadAnalytics();
        else window.addEventListener("load", loadAnalytics);
        // Safety net in case a stalled subresource delays the load event.
        setTimeout(loadAnalytics, 5000);
      })();
    </script>
